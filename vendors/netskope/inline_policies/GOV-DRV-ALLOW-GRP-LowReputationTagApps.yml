    context: "Have an exception process for the low reputation Cloud-Storage Apps blocking rules"
    behavior: "Allow"
    version: "1.0"
    owner: "CISO/DCP Team"
    source: "Stellantis CISO policy"

  naming_breakdown: #Mandatory fields for inline policy documentation.
